services:

  postgres:
    image: postgres:16
    container_name: smartvitra-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: smartvitra
      POSTGRES_USER: smartvitra
      POSTGRES_PASSWORD: smartvitra_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
